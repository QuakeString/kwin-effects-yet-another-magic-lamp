name: Build (Arch Linux)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # KWin has no stable ABI or API across releases, so build weekly against the
    # current rolling packages to catch breakage before users do.
    - cron: '0 4 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install dependencies
        run: pacman -S --noconfirm --needed
          base-devel cmake extra-cmake-modules kwin qt6-base kcmutils
          kconfig kconfigwidgets kcoreaddons kwindowsystem libdrm vulkan-headers

      - name: Report KWin version
        run: pacman -Q kwin

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Verify install layout
        shell: bash
        run: .github/verify-install.sh
